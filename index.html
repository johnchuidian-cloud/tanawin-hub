<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tanawin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #9B3815;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .hub { width: 100%; max-width: 420px; text-align: center; }
  .brand { margin-bottom: 28px; }
  .wordmark {
    position: relative; display: inline-block;
    font-size: 38px; color: #FBF6EF; letter-spacing: 0.5px;
  }
  .star { position: absolute; top: -8px; right: -6px; }
  .tagline {
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px; color: #F5EDE4; opacity: 0.85; margin-top: 6px;
  }
  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: flex; align-items: center; gap: 14px;
    background: #FBF6EF; border-radius: 14px;
    padding: 16px 20px; text-align: left;
    text-decoration: none; transition: transform 0.1s ease;
  }
  .card:active { transform: scale(0.98); }
  .card.disabled { background: #F5EDE4; opacity: 0.72; pointer-events: none; }
  .icon {
    width: 46px; height: 46px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 22px; color: #FBF6EF;
  }
  .icon.active { background: #9B3815; }
  .icon.soon { background: #C97B4A; }
  .meta { flex: 1; min-width: 0; }
  .title {
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 17px; font-weight: 600; color: #3D2317;
  }
  .sub {
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px; color: #6E4B38; margin-top: 2px;
  }
  .arrow { font-size: 20px; color: #9B3815; font-family: sans-serif; }
  .pill {
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 11px; font-weight: 600; color: #6E4B38;
    background: #E6D8C9; padding: 4px 10px; border-radius: 999px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <main class="hub">
    <div class="brand">
      <span class="wordmark">
        Tanawin
        <!-- Placeholder starburst — replace with real logo asset -->
        <svg class="star" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <g fill="#FBF6EF">
            <path d="M12 2 L13 9 L12 11 L11 9 Z"/>
            <path d="M12 22 L11 15 L12 13 L13 15 Z"/>
            <path d="M2 12 L9 11 L11 12 L9 13 Z"/>
            <path d="M22 12 L15 13 L13 12 L15 11 Z"/>
            <path d="M5 5 L10 9 L11 11 L9 10 Z"/>
            <path d="M19 19 L14 15 L13 13 L15 14 Z"/>
            <path d="M19 5 L15 10 L13 11 L14 9 Z"/>
            <path d="M5 19 L9 14 L11 13 L10 15 Z"/>
            <circle cx="12" cy="12" r="1.6"/>
          </g>
        </svg>
      </span>
      <p class="tagline">Bed &amp; Breakfast · Bataan</p>
    </div>
    <div class="cards">
      <a class="card" href="https://tanawin-expenses.pages.dev/">
        <div class="icon active">₱</div>
        <div class="meta">
          <div class="title">Finance</div>
          <div class="sub">Accounting &amp; expenses</div>
        </div>
        <span class="arrow">&rarr;</span>
      </a>
      <div class="card disabled">
        <div class="icon soon">🍳</div>
        <div class="meta">
          <div class="title">Kitchen</div>
          <div class="sub">Staff kitchen operations</div>
        </div>
        <span class="pill">Coming soon</span>
      </div>
      <div class="card disabled">
        <div class="icon soon">▦</div>
        <div class="meta">
          <div class="title">Menu</div>
          <div class="sub">Customer QR menu</div>
        </div>
        <span class="pill">Coming soon</span>
      </div>
    </div>
  </main>
</body>
</html>
