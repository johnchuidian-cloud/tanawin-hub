<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#933212" />
<title>Tanawin</title>
<link rel="icon" href="assets/icon-192.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    /* Must match the background baked into assets/tanawin-icon.jpg exactly,
       so the JPG logo blends into the page with no visible square. */
    background: #933212;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .hub { width: 100%; max-width: 420px; text-align: center; }
  .brand { margin-bottom: 24px; }
  .logo-crop {
    /* The logo JPG is a 500x500 square with the wordmark in a central band;
       crop to that band so the brand block isn't mostly empty maroon. */
    width: 250px; height: 120px; margin: 0 auto;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .logo-crop img { width: 100%; height: auto; }
  .tagline {
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px; color: #F1E4D6; opacity: 0.9; margin-top: 8px;
  }
  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: flex; align-items: center; gap: 14px;
    background: #FBFAF6; border-radius: 14px;
    padding: 16px 20px; text-align: left;
    text-decoration: none; transition: transform 0.1s ease;
  }
  .card:active { transform: scale(0.98); }
  .card.disabled { background: #F4F1E7; opacity: 0.72; pointer-events: none; }
  .icon {
    width: 46px; height: 46px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 22px; color: #FBFAF6;
  }
  .icon.active { background: #9A3518; }
  .icon.soon { background: #CC7459; }
  .meta { flex: 1; min-width: 0; }
  .title {
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 17px; font-weight: 600; color: #1F1B16;
  }
  .sub {
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px; color: #6E6759; margin-top: 2px;
  }
  .arrow { font-size: 20px; color: #9A3518; font-family: sans-serif; }
  .pill {
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 11px; font-weight: 600; color: #3F392F;
    background: #E8E2D0; padding: 4px 10px; border-radius: 999px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <main class="hub">
    <div class="brand">
      <div class="logo-crop">
        <img src="assets/tanawin-icon.jpg" alt="Tanawin" width="500" height="500" />
      </div>
      <p class="tagline">Bed &amp; Breakfast · Bataan</p>
    </div>
    <div class="cards">
      <a class="card" href="https://tanawin-expenses.pages.dev/">
        <div class="icon active">₱</div>
        <div class="meta">
          <div class="title">Finance</div>
          <div class="sub">Accounting &amp; expenses</div>
        </div>
        <span class="arrow">&rarr;</span>
      </a>
      <div class="card disabled">
        <div class="icon soon">🍳</div>
        <div class="meta">
          <div class="title">Kitchen</div>
          <div class="sub">Staff kitchen operations</div>
        </div>
        <span class="pill">Coming soon</span>
      </div>
      <div class="card disabled">
        <div class="icon soon">▦</div>
        <div class="meta">
          <div class="title">Menu</div>
          <div class="sub">Customer QR menu</div>
        </div>
        <span class="pill">Coming soon</span>
      </div>
    </div>
  </main>
</body>
</html>
